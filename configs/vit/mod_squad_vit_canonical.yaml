# E2 — Mod-Squad re-run with adjusted MI-weight hyperparameter.
#
# Existing mod_squad_vit.yaml used mi_weight=0.001; got 70.11±0.61% top1
# vs paper Chen 2022 ~76%. mi_weight=0.001 is on the low end of paper's
# tested range; this config bumps to 0.01 (paper-suggested-stronger MI).
# If PPL still ≈70%, short-recipe artifact (disclose); if 76%+,
# mi_weight tuning is the gap.
#
# 1 seed × 100 epochs × 1 GPU ≈ 36h.
experiment_name: mod_squad_vit_canonical
output_dir: ./outputs/vit_mod_squad_vit_canonical
seed: 789

model:
  type: mod_squad_vit
  num_classes: 1000
  num_experts: 16
  top_k: 2
  mi_weight: 0.01                 # bumped from 0.001 toward paper-canonical
  drop_path_rate: 0.1

algorithm:
  type: none

training:
  epochs: 100
  batch_size: 64
  grad_accum_steps: 4
  lr: 0.00025
  optimizer: adamw
  weight_decay: 0.05
  betas: [0.9, 0.999]
  lr_schedule: cosine
  warmup_epochs: 5
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mixup_switch_prob: 0.5
  amp_dtype: bf16
  _no_compile: true
  max_grad_norm: 1.0

data:
  dataset: imagenet
  data_dir: ./data_cache/imagenet
  num_workers: 8
  augmentation: deit
