# Auxiliary-Loss-Free MoE ViT (Wang et al. 2024) — additional baseline.
# Mirrors the DEPLOYED mod_squad_vit config (replicated from
# outputs/rtx5090_imagenet_vit_faithful/mod_squad_vit_s42/results.json::config)
# except: model.type, no mi_weight (ALF has no aux loss), explicit
# expert_hidden 96 (= mod_squad's implicit default 4*384/16), and the ALF
# bias_update_rate u=1e-3.
experiment_name: alf_moe_vit_s42
output_dir: ./outputs/alf_moe/alf_moe_vit_s42
seed: 42
model:
  type: alf_moe_vit
  num_classes: 1000
  num_experts: 16
  expert_hidden: 96
  top_k: 2
  bias_update_rate: 0.001
  drop_path_rate: 0.1
algorithm:
  type: none
training:
  _compile_mode: reduce-overhead
  amp_dtype: bf16
  batch_size: 256
  cutmix_alpha: 1.0
  epochs: 100
  grad_accum_steps: 1
  label_smoothing: 0.1
  lr: 0.00025
  lr_schedule: cosine
  max_grad_norm: 1.0
  mixup_alpha: 0.8
  mixup_switch_prob: 0.5
  optimizer: adamw
  warmup_epochs: 5
  weight_decay: 0.05
data:
  augmentation: deit
  data_dir: ./data_cache/imagenet
  dataset: imagenet
  num_workers: 16
  prefetch_factor: 4
