# Soft MoE tuning study — 20% screen, R0 (pivot cell).
# Exactly the deployed soft_moe_vit recipe (from
# outputs/rtx5090_imagenet_vit_faithful/soft_moe_vit_s42/results.json::config),
# re-based to the 20% stratified ImageNet subset (train_subset_frac=0.2,
# subset seed 42) for the screening pass. 100 epochs, seed 42.
experiment_name: softmoe_study_r0
output_dir: ./outputs/softmoe_study_screen/r0_pivot
seed: 42
model:
  type: soft_moe_vit
  num_classes: 1000
  num_experts: 32
  slots_per_expert: 1
  drop_path_rate: 0.1
algorithm:
  type: none
training:
  epochs: 100
  batch_size: 256
  grad_accum_steps: 1
  lr: 0.00025
  optimizer: adamw
  weight_decay: 0.05
  lr_schedule: cosine
  warmup_epochs: 5
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mixup_switch_prob: 0.5
  amp_dtype: bf16
  _compile_mode: reduce-overhead
  max_grad_norm: 1.0
data:
  dataset: imagenet
  data_dir: ./data_cache/imagenet
  num_workers: 16
  prefetch_factor: 4
  augmentation: deit
  train_subset_frac: 0.2
  train_subset_seed: 42
