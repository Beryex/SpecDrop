experiment_name: soft_specdrop
output_dir: ./outputs/vit_soft_specdrop
seed: 42
model:
  type: multi_branch_vit_small
  num_classes: 1000
  num_branches: 46
  drop_path_rate: 0.1
algorithm:
  type: soft_specdrop
  p_active: 0.7
  p_inactive: 0.3
  assignment: round_robin
  warmup_ratio: 1.0
training:
  epochs: 100
  batch_size: 64
  grad_accum_steps: 4
  lr: 0.00025
  optimizer: adamw
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
  lr_schedule: cosine
  warmup_epochs: 5
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mixup_switch_prob: 0.5
  amp_dtype: bf16
  _no_compile: true
  max_grad_norm: 1.0
data:
  dataset: imagenet
  data_dir: ./data_cache/imagenet
  num_workers: 8
  augmentation: deit
