experiment_name: hash_layers
output_dir: ./outputs/nlp_hash_layers
seed: 42
model:
  type: hash_layers_transformer_lm
  vocab_size: 50257
  hidden_dim: 384
  num_layers: 6
  num_heads: 6
  max_seq_len: 512
  num_experts: 8
  ffn_dim_per_expert: 192
  dropout: 0.1
algorithm:
  type: none
training:
  epochs: 10
  batch_size: 64
  max_tokens: 500000000
  lr: 0.0003
  optimizer: adamw
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  lr_schedule: cosine
  warmup_steps: 1000
  max_grad_norm: 1.0
data:
  dataset: slimpajama
  data_dir: ./data_cache/slimpajama
  num_workers: 4
  max_seq_len: 512
