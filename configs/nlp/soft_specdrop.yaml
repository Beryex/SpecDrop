experiment_name: soft_specdrop
output_dir: ./outputs/nlp_soft_specdrop
seed: 42
model:
  type: multi_branch_transformer_lm
  vocab_size: 50257
  hidden_dim: 384
  num_layers: 6
  num_heads: 6
  max_seq_len: 512
  num_branches: 7
  ffn_dim_per_branch: 220
  dropout: 0.1
algorithm:
  type: soft_specdrop
  p_active: 0.7
  p_inactive: 0.3
  assignment: round_robin
  warmup_ratio: 1.0
training:
  epochs: 10
  batch_size: 64
  max_tokens: 500000000
  lr: 0.0003
  optimizer: adamw
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  lr_schedule: cosine
  warmup_steps: 1000
  max_grad_norm: 1.0
data:
  dataset: slimpajama
  data_dir: ./data_cache/slimpajama
  num_workers: 4
  max_seq_len: 512
