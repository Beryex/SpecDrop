# T1.2 — CIFAR-100 OURS with M=100 fine labels (5-1 mapping per branch).
# Tests granularity-alignment claim WITHIN a single setting: same model, same
# hyperparams, just route on fine_labels (M=100, K=20 round_robin → 5 fine
# classes per branch) instead of coarse superclass labels (M=20, K=20).
#
# Expected outcomes (paper-relevant either way):
#   - top1 still ≥ dense 74.48: granularity-alignment more lenient than
#     "1 example = 1 category"; even 5-1 mapping works.
#   - top1 drops to ≤72%: alignment is strict; mechanism needs tight binding.
experiment_name: ours_fine
output_dir: ./outputs/cv_ours_fine
seed: 42

model:
  type: multi_branch_resnet110
  base_channels: 16
  num_branches: 20
  branch_channels: [4, 7, 14]   # same as ours K=20 (param-matched ResNet-110)
  num_blocks: 18
  num_classes: 100

algorithm:
  type: soft_specdrop
  num_categories: 100             # M=100 fine labels
  p_active: 0.7
  p_inactive: 0.3
  assignment: round_robin         # cluster c → branch c % 20
  warmup_ratio: 1.0

training:
  epochs: 200
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_schedule: cosine
  warmup_epochs: 5
  route_label_type: fine          # T1.2 — route on fine_labels not coarse

data:
  dataset: cifar100
  data_dir: ./data_cache
  num_workers: 4
