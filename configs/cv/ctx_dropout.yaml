# CIFAR-100 × Contextual Dropout (Fan ICLR 2021, Gaussian variant + KL ELBO).
experiment_name: ctx_dropout
output_dir: ./outputs/cv_ctx_dropout
seed: 42

model:
  type: contextual_dropout_resnet110
  num_classes: 100
  reduction: 8
  kl_weight: 1.0e-4

algorithm:
  type: none

training:
  epochs: 200
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_schedule: cosine
  warmup_epochs: 5

data:
  dataset: cifar100
  data_dir: ./data_cache
  num_workers: 4
