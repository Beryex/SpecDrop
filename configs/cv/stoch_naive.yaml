# E3 — Stochastic SpecDrop with NAIVE per-sample denominator (÷Σm_k).
# Same Bernoulli mask as stoch_fixed; merge dividend reintroduces Jensen bias.
experiment_name: stoch_naive
output_dir: ./outputs/rtx5090_denom_ablation/stoch_naive
seed: 42

model:
  type: multi_branch_resnet110
  base_channels: 16
  num_branches: 20
  branch_channels: [4, 7, 14]
  num_blocks: 18
  num_classes: 100

algorithm:
  type: stochastic_specdrop
  p_active: 0.9
  p_inactive: 0.1
  assignment: round_robin
  warmup_ratio: 1.0
  denom_mode: adaptive

training:
  epochs: 200
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_schedule: cosine
  warmup_epochs: 5

data:
  dataset: cifar100
  data_dir: ./data_cache
  num_workers: 4
