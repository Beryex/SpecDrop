# CIFAR-100 × Soft SpecDrop (OURS) — rtx5090_2 method [6/6].
# Ablation-optimal: p_active=0.7, warmup_ratio=1.0, no SE.
experiment_name: soft_specdrop
output_dir: ./outputs/cv_soft_specdrop
seed: 42

model:
  type: multi_branch_resnet110
  base_channels: 16
  num_branches: 20
  branch_channels: [4, 7, 14]
  num_blocks: 18
  num_classes: 100

algorithm:
  type: soft_specdrop
  p_active: 0.7
  p_inactive: 0.3
  assignment: round_robin
  warmup_ratio: 1.0

training:
  epochs: 200
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_schedule: cosine
  warmup_epochs: 5

data:
  dataset: cifar100
  data_dir: ./data_cache
  num_workers: 4
