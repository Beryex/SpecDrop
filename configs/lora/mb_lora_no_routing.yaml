# MultiBranch-LoRA no-routing (architecture-matched baseline to Ours, SE=0).
# K=20 × r=16 = same LoRA params as ours 225M (on Llama-3.2-1B); all 20
# experts get equal 1/K
# weight per sample (NoDropout algorithm). This isolates the routing benefit
# from the K-branch architecture alone.
model:
  type: multi_branch_lora
  base_model_name: meta-llama/Llama-3.2-1B
  num_experts: 20
  rank: 16
  alpha: 32.0
  dropout: 0.05
  shared_expert_rank: 0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  torch_dtype: bfloat16
  attn_implementation: sdpa
algorithm:
  type: no_dropout
training:
  epochs: 3
  batch_size_per_device: 8
  grad_accum_steps: 16
  lr: 2.0e-4
  warmup_ratio_lr: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_len: 1024
  amp_dtype: bf16
  log_interval: 20
  eval_interval_epochs: 1
data:
  data_root: ./data_cache/lora/natural-instructions
  num_workers: 4
  num_clusters: 20
  subset_frac_train: 1.0
  instances_per_task_train: 100
  instances_per_task_eval: 100
  cluster_cache_dir: ./data_cache/lora
seed: 42
