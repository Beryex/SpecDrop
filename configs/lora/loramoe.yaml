# LoRAMoE (Dou 2023 ACL) — FFN-only, K=6 experts native, softmax gate + β·ℒ_lbc
# balance loss. Rank adjusted so total LoRA params ≈ 225M (matches our K=20
# r=16 MB-LoRA trainable param budget on GQA-aware Llama-3.2-1B).
#
# Llama-3.2-1B FFN-only per-rank: 3 sites × 16 layers × (2048+8192) =
# 491,520 r; × K=6 experts = 2,949,120 r. Per-layer gate params (bias=False,
# 6 experts): 2×2048×6 + 8192×6 = 73,728; × 16 = 1,179,648 gate total.
# Wait — recomputed: LoRAMoE uses a PER-SITE gate (bias=False) Linear(hidden,
# K). 3 MLP sites × 2048 × 6 = 36,864 per layer; × 16 = 589,824 gate total.
# For 225M budget: r ≈ 76 → 2,949,120 × 76 + 589,824 = 224.7M (−0.32%).
model:
  type: lora_moe
  base_model_name: meta-llama/Llama-3.2-1B
  num_experts: 6
  rank: 76
  alpha: 152.0        # 2r
  dropout: 0.05
  balance_weight: 0.1
  target_modules: [gate_proj, up_proj, down_proj]   # FFN-only per Dou 2023
  torch_dtype: bfloat16
  attn_implementation: sdpa
algorithm:
  type: none
training:
  epochs: 3
  batch_size_per_device: 8
  grad_accum_steps: 16
  lr: 2.0e-4
  warmup_ratio_lr: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_len: 1024
  amp_dtype: bf16
  log_interval: 20
  eval_interval_epochs: 1
data:
  data_root: ./data_cache/lora/natural-instructions
  num_workers: 4
  num_clusters: 20
  subset_frac_train: 1.0
  instances_per_task_train: 100
  instances_per_task_eval: 100
  cluster_cache_dir: ./data_cache/lora
seed: 42
